[project]
name = "bolsadepalabras"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "python-docx>=1.2.0",
    "regex>=2024.11.6",
    "torch>=2.11.0",
]

[dependency-groups]
